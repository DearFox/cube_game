name: Manual Build

on:
  # Ручной запуск из вкладки Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Ставим JDK 17 (под проект)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Устанавливаем Gradle (без wrapper)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Укажите версию Gradle, которая нужна проекту.
          # Если не знаете — попробуйте 8.7, 8.10.2 или current.
          gradle-version: '8.7'

      # 4. Собираем проект
      - name: Build with Gradle
        run: gradle build --no-daemon

      # 5. Выгружаем артефакты
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cube-game-build
          path: |
            build/libs/*.jar
            build/distributions/*
          if-no-files-found: warn
